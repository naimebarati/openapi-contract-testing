# Weekly update PRs. Every PR goes through the normal CI; nothing is merged or released automatically.
# Whether the published package still works with newer versions of its dependencies is checked separately by
# .github/workflows/compat.yml.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      # One PR for all minor and patch updates of the tooling used to develop and test the package.
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      # Runtime dependencies (ajv, yaml, ...) get their own PR because they change what users install.
      runtime:
        dependency-type: production
        update-types: [minor, patch]
    # Major versions of any dependency arrive as individual PRs so each one can be judged on its own, except:
    ignore:
      # The types must match the oldest Node the package supports (engines: >=22.12). Newer types would let code use
      # APIs that do not exist on Node 22 without any test noticing. Raise this by hand when the minimum Node changes.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 removed `moduleResolution: node10`, which this package supports, and typescript-eslint does not
      # accept it yet. Move to it deliberately, not through a bot PR.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    groups:
      actions:
        patterns: ['*']
