name: Release

# Publishes to npm with provenance through npm trusted publishing (OIDC): no npm token is stored anywhere.
#
#   git tag v0.1.0-beta.1 && git push origin v0.1.0-beta.1   -> checks, then `npm publish`
#   Actions > Release > Run workflow (any branch)             -> the same checks, then `npm publish --dry-run`
#
# One-time setup on npmjs.com (package > Settings > Trusted Publisher > GitHub Actions):
#   organization/user: naimebarati   repository: openapi-contract-testing   workflow filename: release.yml
# Trusted publishing needs the package to exist (publish a placeholder once, see docs/release-checklist.md), the
# repository to be public (for provenance), and npm >= 11.5.1 (checked below).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: ${{ github.ref_type == 'tag' && 'publish to npm' || 'dry run (no publish)' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # the tag must be reachable from main (checked below)
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: npm supports trusted publishing
        run: |
          node -e "
            const v = require('child_process').execSync('npm --version').toString().trim().split('.').map(Number);
            const ok = v[0] > 11 || (v[0] === 11 && (v[1] > 5 || (v[1] === 5 && v[2] >= 1)));
            console.log('npm', v.join('.'), ok ? 'ok' : 'is older than 11.5.1');
            process.exit(ok ? 0 : 1);
          "
      - name: The tag matches package.json, sits on main and is not published yet
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$VERSION" || { echo "tag $GITHUB_REF_NAME does not match package.json version $VERSION"; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag commit is not on main"; exit 1; }
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then echo "$VERSION is already published"; exit 1; fi
      - run: npm ci
      # format, lint, typecheck, unit/integration/security tests, build, dist smoke, type tests, Jest
      - run: npm run check
      # npm pack + install the tarball into independent ESM, CommonJS and TypeScript projects
      - run: npm run test:pack
      - name: dist-tag from the version (beta/alpha/rc, otherwise latest)
        id: tag
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG=$(node -p "const p = require('./package.json').version.split('-')[1]; p ? p.split('.')[0] : 'latest'")
          MAJOR=$(node -p "require('./package.json').version.split('.')[0]")
          # No stable release before 1.0: the design's acceptance criteria apply to `latest`.
          if [ "$TAG" = "latest" ] && [ "$MAJOR" = "0" ]; then echo "refusing to publish $VERSION as latest; use a pre-release version"; exit 1; fi
          echo "dist-tag: $TAG"
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
      - name: npm needs to correct nothing in package.json
        # npm 11 can correct package.json on the fly while publishing and still report success. A release should not
        # depend on silent corrections, so any correction fails the release before the real publish.
        run: |
          set -o pipefail
          npm publish --dry-run --access public --tag "${{ steps.tag.outputs.name }}" 2>&1 | tee publish-dry-run.log
          if grep -q 'auto-corrected' publish-dry-run.log; then echo "npm corrected package.json; run 'npm pkg fix' and commit the result"; exit 1; fi
      - name: Publish
        if: github.ref_type == 'tag'
        run: npm publish --provenance --access public --tag "${{ steps.tag.outputs.name }}"
      - name: Dry run
        if: github.ref_type != 'tag'
        run: npm publish --dry-run --access public --tag "${{ steps.tag.outputs.name }}"
