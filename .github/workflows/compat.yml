name: Compatibility

# CI runs only when someone pushes, and it installs the exact versions in package-lock.json. This workflow runs on a
# schedule instead and installs what a user installing the package today would get, so a new release of a dependency,
# of Jest/Vitest or of Node that breaks this package is noticed within a week and not by a user.
#
#   ranges      installs with no lockfile: the newest versions that package.json allows (ajv ^8, yaml ^2, jest ^30,
#               vitest ^5, ...). A failure here means a fresh install of the published package may already be broken.
#   published   installs what the npm registry serves right now (`latest`, `beta`) into fresh ESM, CommonJS and
#               TypeScript projects (four `moduleResolution` modes) and uses it. A failure here means users installing
#               the package today get something broken, whatever the cause: a bad release, a registry problem or a
#               dependency that was updated underneath it.
#   next-majors additionally installs the newest versions outside those ranges (a new major of Jest, Vitest, Ajv or
#               yaml). A failure here is early warning: the ranges still hold, but the next major needs work.
#
# A failure opens (or comments on) one issue labelled `compat`; the next fully green run closes it. Nothing is ever
# merged, changed or published by this workflow.
#
# Run it by hand: Actions > Compatibility > Run workflow. "force_failure" makes the first job fail on purpose to
# rehearse the issue handling.

on:
  schedule:
    - cron: '17 5 * * 1' # Mondays, 05:17 UTC
  workflow_dispatch:
    inputs:
      force_failure:
        description: Fail the first job on purpose to rehearse the issue handling
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: compat
  cancel-in-progress: false

jobs:
  ranges:
    name: Newest allowed versions (Node ${{ matrix.node == 'node' && 'latest' || matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the minimum supported Node, 24 is LTS, `node` is whatever the newest release is today.
        node: [22, 24, node]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Rehearsal failure
        if: inputs.force_failure && matrix.node == 22
        run: |
          echo "force_failure was set: failing on purpose"
          exit 1
      # No lockfile and no cache: resolve the ranges in package.json afresh.
      - run: npm install --no-package-lock --no-audit --no-fund
      - name: Installed versions
        run: |
          {
            echo "### Node $(node --version), npm $(npm --version)"
            echo '```'
            npm ls --depth=0 --no-package-lock ajv ajv-draft-04 ajv-formats yaml jest vitest expect typescript tsup 2>&1 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # Same checks as CI except format and lint: a new Prettier or ESLint release changing its opinion is a
      # development concern for the Dependabot PRs, not a compatibility problem for users.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:dist
      - run: npm run test:types
      - run: npm run test:jest
      - run: npm run test:pack

  published:
    name: Published package (${{ matrix.spec }}, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { spec: 'openapi-contract-testing@latest', node: 22 }
          - { spec: 'openapi-contract-testing@latest', node: 24 }
          - { spec: 'openapi-contract-testing@beta', node: 24 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # Uses only the script from this checkout; the package itself comes from the registry, so nothing is built or
      # installed from the repository.
      - run: npm run test:published
        env:
          OCT_PUBLISHED_SPEC: ${{ matrix.spec }}

  next-majors:
    name: Newest versions, even new majors (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --no-package-lock --no-audit --no-fund
      # --no-save keeps package.json as it is; only what is installed changes. TypeScript is left alone on purpose:
      # it is a development tool here, and the pack test already checks several `moduleResolution` modes.
      - name: Install the newest releases outside the declared ranges
        run: >
          npm install --no-save --no-package-lock --no-audit --no-fund
          ajv@latest ajv-formats@latest yaml@latest
          jest@latest @jest/globals@latest vitest@latest @vitest/coverage-v8@latest
      - name: Installed versions
        run: |
          {
            echo "### Newest versions on Node $(node --version)"
            echo '```'
            npm ls --depth=0 --no-package-lock ajv ajv-draft-04 ajv-formats yaml jest vitest expect 2>&1 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:dist
      - run: npm run test:jest
      - run: npm run test:pack

  report:
    name: Issue
    needs: [ranges, published, next-majors]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open, update or close the compat issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RANGES: ${{ needs.ranges.result }}
          PUBLISHED: ${{ needs.published.result }}
          NEXT: ${{ needs.next-majors.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --label compat --state open --json number --jq '.[0].number // empty' || true)

          if [ "$RANGES" = success ] && [ "$PUBLISHED" = success ] && [ "$NEXT" = success ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "All compatibility checks pass again: $RUN_URL"
            fi
            echo "All green."
            exit 0
          fi
          if [ "$RANGES" != failure ] && [ "$PUBLISHED" != failure ] && [ "$NEXT" != failure ]; then
            echo "Nothing failed (ranges: $RANGES, published: $PUBLISHED, next-majors: $NEXT); leaving issues alone."
            exit 0
          fi

          body="Compatibility check of $(date -u +%F): $RUN_URL

          - Package as published on npm (\`latest\` and \`beta\`, installed into fresh projects): **$PUBLISHED**
          - Newest versions allowed by package.json (what a fresh install gets today): **$RANGES**
          - Newest versions including new majors (early warning): **$NEXT**

          \`published\` failing means what users install right now is broken. \`ranges\` failing means the package may break for new installs. \`next-majors\` failing
          alone means the declared ranges still work but a newer major needs attention. Open the run for the installed
          versions (job summary) and the failing step. This issue is closed automatically by the next green run."

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create compat --color D93F0B --description "Scheduled compatibility check failed" 2>/dev/null || true
            gh issue create --label compat --title "Scheduled compatibility check failed" --body "$body"
          fi
