name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 22 is the minimum; 24 is the active LTS; 26 is current. Revisit when the Node schedule changes.
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Unit, security and integration tests (Express, Fastify, Axios, fetch, NestJS, Vitest matcher),
      # including fixtures for OpenAPI 3.0, 3.1 and 3.2.
      - run: npm test
      - run: npm run build
      - run: npm run test:dist
      - run: npm run test:types
      - run: npm run test:jest
      # npm pack + install into independent ESM, CommonJS and TypeScript projects.
      - run: npm run test:pack

  windows:
    name: Windows (Node 24)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:dist
      - run: npm run test:jest
      - run: npm run test:pack

  benchmark:
    name: Benchmark (informational)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Not a gate: records numbers so regressions can be noticed (see benchmarks/BASELINE.md).
      - run: npm run bench -- --json | tee benchmark.json
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark
          path: benchmark.json
