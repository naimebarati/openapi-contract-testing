openapi: 3.1.0
info:
  title: Reference API
  version: 1.0.0
servers:
  - url: http://localhost:3000/api/v1
paths:
  /users/{id}:
    get:
      operationId: getUser
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The user
          headers:
            X-Request-Id:
              required: true
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: No such user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteUser
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204':
          description: Deleted
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: Liveness
          content:
            text/plain:
              schema: { type: string, enum: [ok] }
components:
  schemas:
    User:
      type: object
      required: [id, email]
      additionalProperties: false
      properties:
        id: { type: string }
        email: { type: string, format: email }
        nickname: { type: [string, 'null'] }
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
